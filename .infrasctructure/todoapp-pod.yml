apiVersion: v1
kind: Pod
metadata:
 name: todoapp
 namespace: todoapp
 labels:
   app: todoapp
spec:
 containers:
 - name: todoapp
   image: vsasylsmol88/todoapp:3.0.0
   ports:
   - containerPort: 8000
   livenessProbe:
     httpGet:
       path: /liveness
       port: 8000
     initialDelaySeconds: 10
     periodSeconds: 5
    readinessProbe:
     httpGet:
       path: /readiness
       port: 8000
     initialDelaySeconds: 20
     periodSeconds: 5
