apiVersion: v1
kind: Pod
metadata:
  name: busybox-curl
  namespace: todoapp
  labels:
    app: busybox-curl
    purpose: testing
spec:
  containers:
    - name: busybox-curl
      image: ikulyk404/busyboxplus:curl
      command: ["/bin/sh"]
      args: ["-c", "while true; do sleep 30; done;"]
      resources:
        limits:
          memory: "64Mi"
          cpu: "100m"
        requests:
          memory: "32Mi"
          cpu: "50m"
  restartPolicy: Always
