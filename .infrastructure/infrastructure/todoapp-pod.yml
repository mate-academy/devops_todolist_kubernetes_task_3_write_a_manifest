apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
  labels:
    app: todoapp
spec:
  containers:
  - name: todoapp-container
    image: {vitsheo}/todoapp:3.0.0
    ports:
    - containerPort: 8000
    # Налаштування livenessProbe та readinessProbe
    livenessProbe:
      httpGet:
        path: /api/healthz/live/
        port: 8000
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /api/healthz/ready/
        port: 8000
      initialDelaySeconds: 15
      periodSeconds: 5
