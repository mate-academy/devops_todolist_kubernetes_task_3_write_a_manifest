apiVersion: v1
kind: Pod
metadata:
  name: todapp
  namespace: todoapp
spec:
  containers:
    - name: todapp
      image: mulykovdockerdevops/todoapp:3.0.0
      ports:
        - containerPort: 8000
      livenessProbe:
        httpGet:
          path: /health/
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 5
      readinessProbe:
        httpGet:
          path: /readiness/
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 5
      