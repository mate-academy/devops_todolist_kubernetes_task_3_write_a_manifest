apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
  labels: 
    app: todoapp
spec:
  containers: 
    - name: todoapp
      image: gurianov88/todoapp:3.0.0
      ports:
        - containerPort: 8000
      readinessProbe:
        httpGet:
          path: /api/ready/
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /api/health/    
          port: 8080
        initialDelaySeconds: 15
        periodSeconds: 10
