apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
  labels:
    app: todoapp
spec:
  containers:
    - name: todoapp
      image: rimbozero/todoapp:3.0.0
      imagePullPolicy: Always
      ports:
        - name: http
          containerPort: 8000
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /api/ready/
          port: http
        initialDelaySeconds: 5
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /api/live/
          port: http
        initialDelaySeconds: 10
        periodSeconds: 10
