apiVersion: v1
kind: Pod
metadata:
  name: todoapp-pod
  namespace: todoapp
  labels:
    app: todoapp
spec:
  containers:
  - name: todoapp-container
    image: tanyasavenko/todoapp:3.0.0
    ports:
    - containerPort: 8000

    readinessProbe:
      httpGet:
        path: /api/readiness/
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 10

    livenessProbe:
      httpGet:
        path: /api/liveness/
        port: 8000
      initialDelaySeconds: 10
      periodSeconds: 15