apiVersion: v1
kind: Pod
metadata:
  name: todoapp-pod
  namespace: todoapp
  labels:
    app: todo
spec:
  containers:
  - name: todoapp-container
    image: baga56789/todoapp:3.0.0
    ports:
    - containerPort: 8000
    livenessProbe:
      httpGet:
        path: /api/liveness/
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /api/readiness/
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 10