apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
spec:
  containers:
  - name: todoapp
    image: georgeatoyan/todoapp:3.0.0
    livenessProbe:
      httpGet:
        path: /api/live/
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
    readinessProbe:
      httpGet:
        path: /api/ready/
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5