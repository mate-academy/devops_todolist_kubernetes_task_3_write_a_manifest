apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
  labels:
    app: todoapp
spec:
  containers:
    - name: todoapp
      image: illa140/todoapp:3.0.0
      imagePullPolicy: Always
      ports:
        - containerPort: 8000
      readinessProbe:
        httpGet:
          path: /api/readiness/
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /api/liveness/
          port: 8000
        initialDelaySeconds: 20
        periodSeconds: 20
  restartPolicy: Always
  imagePullSecrets:
    - name: regcred
