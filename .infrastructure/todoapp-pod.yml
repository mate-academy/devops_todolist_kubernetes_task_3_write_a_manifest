apiVersion: v1
kind: Pod
metadata:
  name: todoapp-pod
  namespace: todoapp
spec:
  containers:
    - name: todoapp-pod
      image: aisengrim/todoapp:3.0.0
      ports:
        - containerPort: 8080
      livenessProbe:
        httpGet:
          path: /api/health/
          port: 8080
        InitialDelaySeconds: 10
        periodSeconds: 5
      readinessProbe:
        httpGet:
          path: /api/ready/
          port: 8080
        InitialDelaySeconds: 5
        periodSeconds: 5