apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp

spec:
  containers:
    - name: todoapp
      image: daniilshpak/todoapp:3.0.0
      ports:
        - containerPort: 8000
      readinessProbe:
        httpGet:
          path: /api/ready/
          port: 8000
      livenessProbe:
        httpGet:
          path: /api/health/
          port: 8000