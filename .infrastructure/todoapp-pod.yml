apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
  labels:
    app: todoapp
spec:
  containers:
    - name: todoapp
      image: ovasylkov/todoapp:3.0.0
      ports:
        - containerPort: 8000
      livenessProbe:
        httpGet:
          path: /api/live/
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 5
      readinessProbe:
        httpGet:
          path: /api/ready/
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 5