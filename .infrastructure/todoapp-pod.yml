apiVersion: v1
kind: Pod
metadata:
  name: todoapp-pod
  namespace: todoapp
  labels:
    app: todoapp
    version: "3.0.0"
spec:
  containers:
    - name: todoapp
      image: "{yourname}/todoapp:3.0.0"
      ports:
        - containerPort: 8000
          name: http
          protocol: TCP
      env:
        - name: DJANGO_SETTINGS_MODULE
          value: "todolist.settings"
        - name: DEBUG
          value: "False"
        - name: ALLOWED_HOSTS
          value: "*"
      resources:
        limits:
          memory: "512Mi"
          cpu: "500m"
        requests:
          memory: "256Mi"
          cpu: "250m"
      # Readiness probe - проверяет готовность приложения к обслуживанию запросов
      readinessProbe:
        httpGet:
          path: /api/health/readiness/
          port: 8000
          scheme: HTTP
        initialDelaySeconds: 30 # Ждем 30 секунд после запуска контейнера
        periodSeconds: 10 # Проверяем каждые 10 секунд
        timeoutSeconds: 5 # Таймаут на каждую проверку
        successThreshold: 1 # Сколько успешных проверок нужно для готовности
        failureThreshold: 3 # Сколько неудачных проверок до признания неготовности
      # Liveness probe - проверяет, что приложение живо и отвечает
      livenessProbe:
        httpGet:
          path: /api/health/liveness/
          port: 8000
          scheme: HTTP
        initialDelaySeconds: 60 # Ждем 60 секунд после запуска (больше чем readiness)
        periodSeconds: 30 # Проверяем каждые 30 секунд
        timeoutSeconds: 10 # Таймаут на каждую проверку
        successThreshold: 1 # Сколько успешных проверок нужно
        failureThreshold: 3 # Сколько неудачных проверок до перезапуска пода
  restartPolicy: Always
  # Дополнительные настройки безопасности
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
