apiVersion: v1
kind: Pod
metadata:
  name: todoapp-pod
spec:
  containers:
    - name: todoapp-container
      image: danyakube/todoapp:3.0.0
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet:
          path: /api/readiness
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /api/liveness
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10
