apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
  labels:
    app: mateapp
spec:
  containers:
  - name: todoapp
    image: anatolich911/todoapp:3.0.3
    ports:
    - containerPort: 8080
    livenessProbe:
      httpGet:                    # We have Http calls, startup or Bash commands to check pods liveliness 
        path: /api/liveness
        port: 8080
      initialDelaySeconds: 60    # Delay in seconds for a proper app start, after 60 sec liveliness prob will start its calls
      periodSeconds: 5           # Period in seconds for liveliness to check for pod life
    readinessProbe:
      httpGet:
        path: /api/readiness
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
        



