apiVersion: v1
kind: Pod
metadata:
 name: todoapp
 namespace: todoapp
spec:
  containers:
    - name: todoapp
      image: kenu21/todoapp:3.0.0
      ports:
        - containerPort: 8000
      readinessProbe:
        httpGet:
          path: /api/ready
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /api/health
          port: 8000
        initialDelaySeconds: 80
        periodSeconds: 5
