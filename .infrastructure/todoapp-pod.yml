apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: mateapp
spec:
  containers:
    - name: todoapp
      image: dimak20/todoapp:3.0.0
      ports:
        - containerPort: 8000
      livenessProbe:
        httpGet:
          path: api/health
          port: 8000
        initialDelaySeconds: 20
        periodSeconds: 5
      readinessProbe:
        httpGet:
          path: api/read
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 5