apiVersion: v1
kind: Pod
metadata:
 name: todoapp
 labels:
   app: todoapp
spec:
 containers:
 - name: todoapp
   image: mykhailoivchenko/todoapp:3.0.0
   ports:
   - containerPort: 8080
   livenessProbe:
     httpGet:
       path: /health
       port: 8080
     initialDelaySeconds: 10
     periodSeconds: 5
   readinessProbe:
     httpGet:
       path: /ready
       port: 8080
     initialDelaySeconds: 5
     periodSeconds: 5
