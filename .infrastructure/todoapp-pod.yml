apiVersion: v1
kind: Pod
metadata:
    name: todoapp-pod
    namespace: todoapp
spec:
    containers:
    - name: todoapp-pod
      image: foxytail8/todoapp:3.0.0
      ports:
      - containerPort: 8000
      livenessProbe:
        httpGet:
          path: /api/liveness
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 5
      readinessProbe:
        httpGet:
          path: /api/readiness
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 5