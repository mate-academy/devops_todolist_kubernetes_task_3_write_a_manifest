apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
  labels:
    app: todoapp
spec:
  containers:
  - name: todoapp
    image: <your_username>/todoapp:3.0.0
    ports:
    - containerPort: 8000
    readinessProbe:
      httpGet:
        path: /api/health/readiness/
        port: 8000
      initialDelaySeconds: 10
      periodSeconds: 5
    livenessProbe:
      httpGet:
        path: /api/health/liveness/
        port: 8000
      initialDelaySeconds: 15
      periodSeconds: 10