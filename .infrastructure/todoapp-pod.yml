apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
spec:
  containers:
    - name: todoapp
      image: sangooooo/todoapp:3.0.0
      ports:
        - containerPort: 8080

      readinessProbe:
        httpGet:
          path: /api/readiness/
          port: 8080

      livenessProbe:
        httpGet:
          path: /api/liveness/
          port: 8080