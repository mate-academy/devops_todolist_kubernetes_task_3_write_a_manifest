apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
spec:
  containers:
    - name: todoapp
      image: vsupruniuk/todoapp:3.0.0
      ports:
        - containerPort: 8080
      livenessProbe:
        httpGet:
          port: 8080
          path: /api/live/
        initialDelaySeconds: 30
        periodSeconds: 10
      readinessProbe:
        httpGet:
          port: 8080
          path: /api/ready/
        initialDelaySeconds: 5
        periodSeconds: 5
