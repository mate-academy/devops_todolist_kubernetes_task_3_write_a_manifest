apiVersion: v1
kind: Pod
metadata:
  name: todoapp-pod
  namespace: todoapp
spec:
  containers:
    - name: todoapp
      image: vanyas627/todoapp:3.0.0
      ports:
        - containerPort: 8000
      readinessProbe:
        httpGet:
          path: /api/ready
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /api/liveness
          port: 8000
        initialDelaySeconds: 40
        periodSeconds: 5