apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
spec:
  containers:
  - name: todoapp
    image: olexandrkv/todoapp:3.0.0
    imagePullPolicy: Always
    ports:
    - containerPort: 8000
    readinessProbe:
      httpGet:
        path: /api/readiness/
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 5
    livenessProbe:
      httpGet:
        path: /api/liveness/
        port: 8000
      initialDelaySeconds: 10
      periodSeconds: 10
