apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
spec:
  containers:
  - name: busybox
    image: midandnight/todoapp:3.0.0
    ports:
      - containerPort: 8000

    livenessProbe:
      httpGet:
        path: /api/health/readiness/
        port: 8000
      initialDelaySeconds: 60
      periodSeconds: 5

    readinessProbe:
      httpGet:
        path: /api/health/liveness/
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 5