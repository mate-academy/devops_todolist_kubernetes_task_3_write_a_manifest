apiVersion: v1
kind: Pod
metadata:
 name: todoapp-pod
 namespace: todoapp
 labels:
   app: todoapp
spec:
  containers:
    - name: todoapp
      image: diashockh/todoapp:3.0.0
      ports:
        - containerPort: 8080
          livenessProbe:
            httpGet:
              path: api/livenese
              port: 8080
              initialDelaySeconds: 5
              periodSeconds: 10
          readinessProbe:
            httpGet:
              path: api/readiness
              port: 8080
              initialDelaySeconds: 5
              periodSeconds: 10