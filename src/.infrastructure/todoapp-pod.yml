apiVersion: v1
kind: Pod
metadata:
 name: todoapp-pod
 namespace: todoapp
spec:
  containers:
    - name: todoapp
      image: ivanoid777/todoapp:3.0.0
      ports:
        - containerPort: 8000
      livenessProbe:
        httpGet:
          path: /api/liveness/
          port: 8000
        periodSeconds: 10
      readinessProbe:
        httpGet:
          path: /api/readiness/
          port: 8000
        periodSeconds: 10
