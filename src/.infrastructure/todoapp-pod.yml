apiVersion: v1
kind: Pod
metadata:
    name: todoapp
    namespace: todoapp
    labels:
      app: todoapp
spec:
    containers:
    - name: todoapp
      image: clem97121/todoapp:3.0.0
      imagePullPolicy: Always
      ports:
      - containerPort: 8080
      livenessProbe:
        httpGet:
          path: /api/health
          port: 8080
        initialDelaySeconds: 20
        periodSeconds: 5
      readinessProbe:
        httpGet:
          path: /api/ready
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 5