apiVersion: v1
kind: Pod
metadata:
  name: apppy
  namespace: appspace
spec:
  containers:
    - name: apppy
      image: beliar24/app_py:5.0
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet:
          path: "/readiness"
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: "/liveness"
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5